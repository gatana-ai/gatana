# Gatana with Docker Compose: the app, Postgres, the Code Mode worker and the web fetcher.
# Guide: https://docs.gatana.ai/docker-compose
#
# Start:    cp .env.example .env && docker compose up -d --wait
# Upgrade:  download this file again, then: docker compose up -d --wait
#
# A line in .env overrides a version, for example GATANA_VERSION=v1.48.4.
# GATANA_WORKER_VERSION must be the version that the app names in its start log.
# Needs Docker Compose 2.24.4 or newer.

name: gatana

services:
  app:
    image: ghcr.io/gatana-ai/gatana:${GATANA_VERSION:-v1.53.5}
    restart: unless-stopped
    # Every Gatana setting in .env reaches the app. This file fixes the settings below.
    env_file: .env
    environment:
      # One organization on the public URL. No DNS record and no certificate is needed.
      SINGLE_TENANT_MODE: app
      POSTGRES_HOST: postgres
      POSTGRES_PORT: '5432'
      POSTGRES_USERNAME: gatana
      POSTGRES_DATABASE: gatana
      # The worker runs agent code. It reaches the app on the worker network only.
      CODE_MODE_WORKER_URL: http://worker:8080
      CODE_MODE_CALLBACK_URL: http://app:3000
      FETCH_SERVICE_URL: http://fetcher:8080
    ports:
      - '${GATANA_PORT:-8080}:3000'
    networks:
      - default
      - db
      - worker
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_healthy
      fetcher:
        condition: service_healthy
    healthcheck:
      # Ready: the migrations are done and the app serves requests.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      # An upgrade can build an index on a large table, which takes minutes.
      start_period: 30m

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg18}
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatana
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: gatana
    volumes:
      - postgres-data:/var/lib/postgresql
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/10-extensions.sql
    networks:
      - db
    healthcheck:
      # TCP, not the socket: the first start runs a temporary server on the socket only.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U gatana -d gatana']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  worker:
    image: ghcr.io/gatana-ai/gatana-worker:${GATANA_WORKER_VERSION:-v1.3.3}
    restart: unless-stopped
    # The worker runs all code that it receives. Never publish its port.
    networks:
      - worker
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  fetcher:
    image: ghcr.io/gatana-ai/gatana-web-fetcher:${GATANA_FETCHER_VERSION:-v1.14.6}
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  # Only the app reaches Postgres and the worker. Neither has a route out.
  db:
    internal: true
  worker:
    internal: true

volumes:
  postgres-data:

configs:
  postgres-init:
    # Runs once, when the database is created. Semantic search needs vector before the app's first start.
    content: |
      create extension if not exists pgcrypto;
      create extension if not exists pg_trgm;
      create extension if not exists vector;
