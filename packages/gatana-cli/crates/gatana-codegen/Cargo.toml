[package]
name = "gatana-codegen"
description = "Generates the gatana-api client from the Gatana OpenAPI documents"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars = "0.8"
typify = "0.8"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
prettyplease = "0.2"
