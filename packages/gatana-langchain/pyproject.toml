[project]
name = "gatana-langchain"
version = "2.0.1"
description = "A toolkit for building LangChain applications"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Gatana", email = "engineering@gatana.ai" },
]
requires-python = ">=3.11"
keywords = ["gatana", "langchain", "llm", "ai", "agents", "gatana"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=0.3",
    "gatana-client>=0.1.0",
    "deepagents>=0.4",
]

[project.urls]
Homepage = "https://github.com/gatana-ai/gatana/tree/main/packages/gatana-langchain"
Repository = "https://github.com/gatana-ai/gatana"
Issues = "https://github.com/gatana-ai/gatana/issues"
Changelog = "https://github.com/gatana-ai/gatana/releases?q=gatana-langchain"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gatana_langchain"]

# Keeps the dev setup below (tests, pre-commit, .python-version) out of the sdist
[tool.hatch.build.targets.sdist]
include = ["/gatana_langchain"]

[tool.uv.sources]
gatana-client = { path = "../gatana-python", editable = true }

# The Python dev setup lives in this package; packages/gatana-python is generated
# code and is installed here (editable) through the source above.
[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "type" },
]
lint = ["ruff>=0.9", "pre-commit>=4"]
test = ["pytest>=8", "pytest-cov>=6", "pytest-asyncio>=0.24"]
type = ["mypy>=1.14"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["gatana_langchain", "gatana_client"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"

[tool.coverage.run]
source = ["gatana_langchain"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
